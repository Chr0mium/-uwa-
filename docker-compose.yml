services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK_DATA=${USE_MOCK_DATA:-false}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend